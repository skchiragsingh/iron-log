<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131311">
<meta name="description" content="IRON LOG — simple workout tracking and PR history.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #131311;
  --card: #1D1C18;
  --chalk: #ECE8DD;
  --muted: #8C8674;
  --faint: #55524A;
  --accent: #D6482F;
  --accent-dim: #4A241C;
  --line: #322F28;
  --done-dim: #253524;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--chalk);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 60px;
}

.wrap { max-width: 500px; margin: 0 auto; padding: 0 18px; }

header {
  padding: 26px 18px 0;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
  border-bottom: 1px solid var(--line);
}
header .inner { max-width: 500px; margin: 0 auto; }
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 1px;
  line-height: 1;
  margin-bottom: 4px;
}
.date-tag { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 16px; }

.day-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.day-tab.active { background: var(--accent); border-color: var(--accent); color: var(--chalk); }

.section-label { font-size: 13px; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }

.progress-bar-wrap {
  background: var(--line);
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  margin: 6px 0 2px;
}
.progress-bar-fill { background: var(--accent); height: 100%; transition: width 0.25s ease; }
.progress-text { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

.exercise-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.exercise-card.complete { border-color: var(--done-dim); }
.exercise-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.exercise-name-wrap { display: flex; flex-direction: column; }
.exercise-name { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 0.4px; }
.exercise-target { font-size: 12px; color: var(--muted); margin-top: 1px; }

.sets-list { display: flex; flex-direction: column; gap: 5px; }
.set-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.set-idx { color: var(--faint); width: 16px; font-variant-numeric: tabular-nums; }
.set-vals { color: var(--chalk); font-variant-numeric: tabular-nums; }
.set-vals b { font-weight: 600; }
.set-remove { margin-left: auto; background: none; border: none; color: var(--faint); cursor: pointer; font-size: 13px; }
.set-remove:hover { color: var(--accent); }

.add-set-row { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.add-set-row input {
  background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
  color: var(--chalk); padding: 7px 8px; font-size: 13px; width: 100%; font-family: 'Inter', sans-serif;
}
.add-set-row input::placeholder { color: var(--faint); }
.add-set-row input:focus { outline: none; border-color: var(--accent); }
.add-set-row button {
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent);
  border-radius: 3px; padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.add-set-row button:hover { background: var(--accent); color: var(--chalk); }

.pr-badge {
  display: inline-block; background: var(--accent-dim); color: var(--accent);
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle;
}

.history-day { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
.history-day summary {
  padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  list-style: none; font-size: 14px; color: var(--chalk); font-weight: 600;
}
.history-day summary::-webkit-details-marker { display: none; }
.history-day summary .meta { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.history-day .body { padding: 0 16px 14px; border-top: 1px solid var(--line); }
.history-ex { padding-top: 12px; }
.history-ex .name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.4px; margin-bottom: 3px; }
.history-ex .sets { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }

.loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="inner">
      <h1>IRON LOG</h1>
      <div class="date-tag" id="today-tag"></div>
      <div class="day-tabs" id="day-tabs"></div>
    </div>
  </header>

  <div class="wrap">
    <div id="loading" class="loading">Loading your log…</div>
    <div id="app" style="display:none;">
      <div class="section-label" id="today-label"></div>
      <div class="progress-text" id="progress-text"></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
      <div id="today-exercises" style="margin-top:14px;"></div>

      <div class="section-label">Data</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button id="export-btn" style="flex:1;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:9px;font-weight:600;cursor:pointer;">Export Backup</button>
        <button id="import-btn" style="flex:1;background:var(--card);color:var(--chalk);border:1px solid var(--line);border-radius:3px;padding:9px;font-weight:600;cursor:pointer;">Import Backup</button>
        <input id="import-file" type="file" accept=".json,application/json" style="display:none;">
      </div>
      <div class="section-label">Past sessions</div>
      <div id="history"></div>
    </div>
  </div>
</div>

<script>
const PROGRAM = {
  "Chest, Shoulders & Biceps": [
    { name: "Incline Smith Machine Press", target: "3 × 6–8" },
    { name: "Flat Dumbbell Press", target: "3 × 8–10" },
    { name: "Pec Deck Fly", target: "2 × 12–15" },
    { name: "Dumbbell Lateral Raise", target: "3 × 12–15" },
    { name: "Incline Dumbbell Curl", target: "3 × 10–12" },
    { name: "Dumbbell Preacher Curl", target: "3 × 10–12" },
    { name: "Slam Ball Overhead Throw", target: "3 × 5–8 explosive reps" }
  ],
  "Back & Triceps": [
    { name: "Wide Grip Row", target: "3 × 6–8" },
    { name: "Lat Pulldown", target: "3 × 8–10" },
    { name: "Close Grip Cable Row", target: "3 × 10–12" },
    { name: "Hyperextensions", target: "2 × 12–15" },
    { name: "Rear Delt Raise", target: "3 × 15" },
    { name: "Cable Pushdown", target: "3 × 10–12" },
    { name: "Overhead Cable Extension", target: "2 × 10–12" },
    { name: "Kettlebell Swings", target: "3 × 15–20" }
  ],
  "Legs": [
    { name: "Back Squat", target: "3 × 6–8" },
    { name: "Bulgarian Split Squat", target: "3 × 8 each leg" },
    { name: "Leg Curl", target: "3 × 10–12" },
    { name: "Leg Extension", target: "3 × 10–12" },
    { name: "Standing Calf Raise", target: "4 × 12–15" },
    { name: "Tibialis Raise", target: "3 × 15–20" },
    { name: "Goblet Carry", target: "3 × 50 m" },
    { name: "Cable Crunch", target: "2 × 10–15" },
    { name: "Easy-Pace Run", target: "15–20 min" }
  ],
  "Torso": [
    { name: "Flat Barbell Press", target: "3 × 8–10" },
    { name: "High-to-Low Cable Fly", target: "2 × 12–15" },
    { name: "Barbell Row", target: "2 × 8–10" },
    { name: "Lat Pulldown", target: "2 × 10–12" },
    { name: "Smith Machine Shoulder Press", target: "2 × 8–10" },
    { name: "Side Raises", target: "2 × 12–15" },
    { name: "Hanging Knee/Leg Raise", target: "2 × 8–15" },
    { name: "Easy-Pace Run", target: "20 min" }
  ],
  "Limbs": [
    { name: "Broad Jump", target: "3 × 3–5" },
    { name: "Bodyweight Jump Squat", target: "3 × 5–6" },
    { name: "Hip Thrust", target: "3 × 6–8" },
    { name: "RDL", target: "2 × 6–8" },
    { name: "Close Grip Bench Press", target: "3 × 8–10" },
    { name: "Dumbbell Curl", target: "3 × 10–12" },
    { name: "Lateral Shuffle", target: "3 × 15–20 m/side" },
    { name: "5-10-15 Shuttle", target: "3 reps" },
    { name: "Slam Ball Floor Slams", target: "3 × 20–30 sec" }
  ]
};
const DAY_NAMES = Object.keys(PROGRAM);

const todayKey = new Date().toISOString().slice(0,10);
const todayLabel = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
document.getElementById('today-tag').textContent = todayLabel;

let sessions = {}; // { "2026-09-04": { day: "Legs", exercises: [{name, target, sets:[{reps, weight}]}] } }
let selectedDay = DAY_NAMES[0];

function targetSetCount(target) {
  const m = target.match(/^(\d+)/);
  return m ? parseInt(m[1]) : 3;
}

function bestWeight(sets) {
  const withWeight = sets.filter(s => s.weight);
  if (!withWeight.length) return 0;
  return Math.max(...withWeight.map(s => s.weight));
}

function allTimeBest(exerciseName, excludeDate) {
  let best = 0;
  for (const [date, session] of Object.entries(sessions)) {
    if (date === excludeDate) continue;
    for (const ex of session.exercises) {
      if (ex.name === exerciseName) {
        const b = bestWeight(ex.sets);
        if (b > best) best = b;
      }
    }
  }
  return best;
}

async function load() {
  try {
    const stored = localStorage.getItem('ironLogSessions');
    if (stored) sessions = JSON.parse(stored);
  } catch (e) { sessions = {}; }

  try {
    const lastDay = localStorage.getItem('ironLogLastDay');
    if (lastDay && DAY_NAMES.includes(lastDay)) selectedDay = lastDay;
  } catch (e) {}

  if (sessions[todayKey]) selectedDay = sessions[todayKey].day;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderTabs();
  render();
}

function save() {
  try { localStorage.setItem('ironLogSessions', JSON.stringify(sessions)); }
  catch (e) { console.error('Save failed', e); }
}
function saveLastDay() {
  try { localStorage.setItem('ironLogLastDay', selectedDay); } catch (e) {}
}

function ensureTodaySession() {
  if (!sessions[todayKey] || sessions[todayKey].day !== selectedDay) {
    sessions[todayKey] = {
      day: selectedDay,
      exercises: PROGRAM[selectedDay].map(e => ({ name: e.name, target: e.target, sets: [] }))
    };
  }
  return sessions[todayKey];
}

function selectDay(day) {
  selectedDay = day;
  saveLastDay();
  renderTabs();
  render();
}

function renderTabs() {
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = DAY_NAMES.map(d =>
    `<button class="day-tab ${d === selectedDay ? 'active' : ''}" onclick="selectDay('${d.replace(/'/g,"\\'")}')">${d}</button>`
  ).join('');
}

function render() {
  const session = ensureTodaySession();
  document.getElementById('today-label').textContent = "Today · " + selectedDay;

  const totalTargetSets = session.exercises.reduce((sum, ex) => sum + targetSetCount(ex.target), 0);
  const doneSets = session.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
  const pct = totalTargetSets ? Math.min(100, Math.round((doneSets / totalTargetSets) * 100)) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${doneSets} of ${totalTargetSets} sets logged`;

  const container = document.getElementById('today-exercises');
  container.innerHTML = session.exercises.map((ex, exIdx) => {
    const targetCount = targetSetCount(ex.target);
    const complete = ex.sets.length >= targetCount;
    const pr = allTimeBest(ex.name, todayKey);
    const setsHtml = ex.sets.map((s, sIdx) => {
      const isPR = pr > 0 && s.weight > pr;
      const weightStr = s.weight ? `<b>${s.weight}</b> kg` : 'bodyweight';
      return `<div class="set-row">
        <span class="set-idx">${sIdx+1}</span>
        <span class="set-vals"><b>${s.reps}</b> reps · ${weightStr}</span>
        ${isPR ? '<span class="pr-badge">PR</span>' : ''}
        <button class="set-remove" onclick="removeSet(${exIdx},${sIdx})">✕</button>
      </div>`;
    }).join('');
    return `<div class="exercise-card ${complete ? 'complete' : ''}">
      <div class="exercise-top">
        <div class="exercise-name-wrap">
          <div class="exercise-name">${escapeHtml(ex.name)}</div>
          <div class="exercise-target">Target: ${escapeHtml(ex.target)}</div>
        </div>
      </div>
      <div class="sets-list">${setsHtml || '<div class="set-row" style="color:var(--faint)">No sets logged yet</div>'}</div>
      <div class="add-set-row">
        <input type="number" inputmode="numeric" placeholder="Reps" id="reps-${exIdx}">
        <input type="number" inputmode="decimal" placeholder="Weight kg (optional)" id="weight-${exIdx}">
        <button onclick="addSet(${exIdx})">+ Set</button>
      </div>
    </div>`;
  }).join('');

  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('history');
  const dates = Object.keys(sessions).filter(d => d !== todayKey && sessions[d].exercises.some(e => e.sets.length > 0)).sort().reverse();
  if (dates.length === 0) {
    container.innerHTML = `<div class="empty" style="padding:20px 20px;">No past sessions yet.</div>`;
    return;
  }
  container.innerHTML = dates.map(date => {
    const session = sessions[date];
    const label = new Date(date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const loggedExercises = session.exercises.filter(e => e.sets.length > 0);
    const body = loggedExercises.map(ex => {
      const setsStr = ex.sets.map(s => s.weight ? `${s.reps}×${s.weight}kg` : `${s.reps} reps`).join(', ');
      return `<div class="history-ex">
        <div class="name">${escapeHtml(ex.name)}</div>
        <div class="sets">${setsStr}</div>
      </div>`;
    }).join('');
    return `<details class="history-day">
      <summary>${label} <span class="meta">${session.day} · ${loggedExercises.length} exercises</span></summary>
      <div class="body">${body}</div>
    </details>`;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addSet(exIdx) {
  const repsInput = document.getElementById(`reps-${exIdx}`);
  const weightInput = document.getElementById(`weight-${exIdx}`);
  const reps = parseFloat(repsInput.value);
  const weight = parseFloat(weightInput.value);
  if (!reps) return;
  const session = ensureTodaySession();
  session.exercises[exIdx].sets.push({ reps, weight: isNaN(weight) ? 0 : weight });
  save();
  render();
}

function removeSet(exIdx, sIdx) {
  sessions[todayKey].exercises[exIdx].sets.splice(sIdx, 1);
  save();
  render();
}

load();
</script>
</body>
</html>
